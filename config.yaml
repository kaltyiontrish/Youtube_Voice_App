audio:
  device: null
  sample_rate: 16000
aec:
  enabled: false
  backend: echoff
  loopback_device: null
  frame_ms: 10
  stream_delay_ms: 0
asr:
  backend: whisper
  models_dir: ./models
  device: cuda
  language: en
  whisper:
    model: large-v3-turbo
    compute_type: float16
    beam_size: 1
    condition_on_previous_text: false
  parakeet:
    model_id: nemo-parakeet-tdt-0.6b-v3
    quantization: null
  nemotron:
    model_id: codavidgarcia/nemotron-3.5-asr-streaming-0.6b-onnx
    chunk_ms: 320
    precision: fp16
    language: auto
  vosk:
    model_en: vosk-model-small-en-us-0.15
    model_pt: vosk-model-small-pt-0.3
    grammar: null
vad:
  enabled: true
  model_path: ./models/vad/silero_vad.onnx
  threshold: 0.5
  min_speech_ms: 150
  min_silence_ms: 400
  max_utterance_s: 25.0
trigger:
  words:
  - youtube
  - you tube
  - iutube
  - u tube
  - utube
  trigger_window_ms: 1500
  silence_end_ms: 800
  query_max_ms: 6000
player:
  mpv_path: mpv
  ipc_path: null
  audio_only: true
  volume_step: 10
  volume_min: 0
  volume_max: 130
  start_timeout_s: 10
  extra_args:
  - --no-video
  - --really-quiet
  - --idle=yes
  playlist_path: ./playlists.json
search:
  results: 10
  cookies_from_browser: null
  socket_timeout_s: 15
behaviour:
  log_transcripts: true
  log_path: ./logs/transcripts.log
  log_level: INFO
  ignore_trigger_ms_after_play: 500
  require_same_utterance_while_playing: true
  ui: true
commands:
- action: play
  verbs:
  - play
  - passa
  - toca
  - poe
  - mete
  takes_query: true
- action: add
  verbs:
  - add
  - adiciona
  takes_query: false
- action: remove
  verbs:
  - remove
  - remover
  - tira
  takes_query: false
- action: jump
  verbs:
  - jump
  - salta para
  takes_query: true
- action: next
  verbs:
  - next
  - proximo
  - seguinte
  - outra
  - salta
  takes_query: false
- action: prev
  verbs:
  - previous
  - anterior
  - volta
  takes_query: false
- action: pause
  verbs:
  - pause
  - pausa
  takes_query: false
- action: stop
  verbs:
  - stop
  - para
  - chega
  takes_query: false
- action: resume
  verbs:
  - continue
  - continua
  - retoma
  takes_query: false
- action: volume_up
  verbs:
  - louder
  - mais alto
  - aumenta
  - sobe o som
  takes_query: false
- action: volume_down
  verbs:
  - quieter
  - mais baixo
  - baixa
  - baixa o som
  takes_query: false
ui:
  overlay_width: 1100
  overlay_height: 700
  always_on_top: true
  show_playlist: true
  fade_after_s: 30
  hide_after_s: 120
  hide_while_playing: false
  mode: expanded
  theme: midnight
